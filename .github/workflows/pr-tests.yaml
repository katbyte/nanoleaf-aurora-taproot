---
name: tests
on:
  push:
    branches: [ 'main' ]
  pull_request:
    types: ['opened', 'synchronize']
    paths:
      - '.github/**'
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'makefile'
      - 'vendor/**'
      - 'scripts/apicheck.py'
      - 'sdk/aurora-api-specs/**'
      - 'acceptance/testdata/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: ./.go-version
      # every test runs against a canned controller or a recording of a real one: no device is needed
      - run: make test
      # the SDK must have a method for everything the saved documentation lists
      - run: make apicheck
