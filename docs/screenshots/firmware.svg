<text x="24.00px" y="47.80px" xml:space="preserve"><tspan xml:space="preserve">$ taproot firmware all</tspan></text><text x="24.00px" y="64.60px" xml:space="preserve"><tspan xml:space="preserve" fill="#00FEFE">main-arch</tspan><tspan xml:space="preserve">: on </tspan><tspan xml:space="preserve" fill="#4B4B4B">5.3.2</tspan><tspan xml:space="preserve">, no update waiting </tspan><tspan xml:space="preserve" fill="#4B4B4B">{&quot;firmwareAvailability&quot;:false,&quot;newFirmwareVersion&quot;:null}</tspan><tspan xml:space="preserve"/></text><text x="24.00px" y="81.40px" xml:space="preserve"><tspan xml:space="preserve" fill="#00FEFE">main-sink</tspan><tspan xml:space="preserve">: on </tspan><tspan xml:space="preserve" fill="#4B4B4B">5.2.1</tspan><tspan xml:space="preserve">, </tspan><tspan xml:space="preserve" fill="#31BB71">update to 5.3.2 available</tspan><tspan xml:space="preserve">, not installed. To have the controller fetch and install it: </tspan><tspan xml:space="preserve" fill="#04D7D7">taproot firmware trigger main-sink</tspan><tspan xml:space="preserve"/></text><text x="24.00px" y="98.20px" xml:space="preserve"><tspan xml:space="preserve" fill="#00FEFE">test</tspan><tspan xml:space="preserve">: on </tspan><tspan xml:space="preserve" fill="#4B4B4B">5.3.2</tspan><tspan xml:space="preserve">, no update waiting </tspan><tspan xml:space="preserve" fill="#4B4B4B">{&quot;firmwareAvailability&quot;:false,&quot;newFirmwareVersion&quot;:null}</tspan><tspan xml:space="preserve"/></text>
